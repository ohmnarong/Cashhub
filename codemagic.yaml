workflows:
  flutter-ios:
    name: Cashhub iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios .
      - name: Update iOS deployment target
        script: |
          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, "13.0"/g' Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' Runner.xcodeproj/project.pbxproj
      - name: Build iOS app (no code sign)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/codemagic*/logs/*.log
      - flutter_drive.log
