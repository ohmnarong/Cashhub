workflows:
  flutter-ios:
    name: Cashhub iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios .
      - name: Update iOS deployment target
        script: |
          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, "13.0"/g' Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' Runner.xcodeproj/project.pbxproj
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS app & Create IPA
        script: |
          flutter build ipa --release --no-codesign
          
          # ✅ สร้างไฟล์ plist ชั่วคราว แทนฝัง XML ใน YAML
          cat > /tmp/exportOptions.plist <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>development</string>
  <key>signingStyle</key>
  <string>manual</string>
  <key>compileBitcode</key>
  <false/>
</dict>
</plist>
PLIST
          
          # ✅ สร้าง .ipa จาก .xcarchive
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath build/ios/ipa/
          
          # ✅ แสดงผลลัพธ์
          echo "=== ✅ IPA files created ==="
          ls -lh build/ios/ipa/*.ipa
    artifacts:
      - "**/*.ipa"
      - "build/ios/ipa/*.ipa"
      - "build/ios/archive/*.xcarchive"
      - /tmp/codemagic*/logs/*.log
      - flutter_drive.log
