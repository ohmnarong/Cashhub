workflows:
  flutter-ios:
    name: Cashhub iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios .
      - name: Update iOS deployment target
        script: |
          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, "13.0"/g' Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' Runner.xcodeproj/project.pbxproj
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS app & Create IPA
        script: |
          flutter build ipa --release --no-codesign
          
          # ✅ สร้าง .ipa จาก .xcarchive โดยตรง ไม่ต้องใบรับรอง!
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist <(cat <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>development</string>
  <key>signingStyle</key>
  <string>manual</string>
  <key>compileBitcode</key>
  <false/>
  <key>teamID</key>
  <string></string>
</dict>
</plist>
EOF
) \
            -exportPath build/ios/ipa/
          
          # ✅ แสดงไฟล์เพื่อยืนยัน
          echo "=== ✅ IPA files created ==="
          ls -lh build/ios/ipa/*.ipa
    artifacts:
      - "**/*.ipa"
      - "build/ios/ipa/*.ipa"
      - "build/ios/archive/*.xcarchive"
      - /tmp/codemagic*/logs/*.log
      - flutter_drive.log
