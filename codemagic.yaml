workflows:
  flutter-ios:
    name: Flutter iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: 16.0
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Generate iOS project
        script: flutter create --platforms=ios .
      - name: Update iOS deployment target to 13.0
        script: |
          cd ios
          sed -i '' "s/platform :ios, '.*'/platform :ios, '13.0'/g" Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g" Runner.xcodeproj/project.pbxproj
      - name: Build iOS app
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
