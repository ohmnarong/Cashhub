workflows:
  flutter-ios:
    name: Cashhub iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate iOS project
        script: |
          flutter create --platforms=ios .
      - name: Update iOS deployment target
        script: |
          cd ios
          sed -i '' 's/platform :ios, .*/platform :ios, "13.0"/g' Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' Runner.xcodeproj/project.pbxproj
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build iOS app & Create IPA
        script: |
          flutter build ipa --release --no-codesign
          
          # ✅ สร้าง plist ด้วย echo — ปลอดภัย ไม่มี YAML error!
          PLIST=/tmp/exportOptions.plist
          echo '<?xml version="1.0" encoding="UTF-8"?>' > $PLIST
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> $PLIST
          echo '<plist version="1.0">' >> $PLIST
          echo '<dict>' >> $PLIST
          echo '  <key>method</key>' >> $PLIST
          echo '  <string>development</string>' >> $PLIST
          echo '  <key>signingStyle</key>' >> $PLIST
          echo '  <string>manual</string>' >> $PLIST
          echo '  <key>compileBitcode</key>' >> $PLIST
          echo '  <false/>' >> $PLIST
          echo '</dict>' >> $PLIST
          echo '</plist>' >> $PLIST
          
          # ✅ สร้าง .ipa จาก .xcarchive
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist $PLIST \
            -exportPath build/ios/ipa/
          
          # ✅ แสดงผล
          echo "=== ✅ IPA files ==="
          ls -lh build/ios/ipa/*.ipa 2>/dev/null || echo "⚠️ No IPA found"
    artifacts:
      - "**/*.ipa"
      - "build/ios/ipa/*.ipa"
      - "build/ios/archive/*.xcarchive"
      - /tmp/codemagic*/logs/*.log
      - flutter_drive.log
