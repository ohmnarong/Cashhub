workflows:
flutter-ios:
name: Cashhub iOS Build
max_build_duration: 120
instance_type: mac_mini_m2

environment:
  flutter: 3.24.0
  xcode: 16.0
  cocoapods: default
  ios_signing:
    distribution_type: app_store
    bundle_identifier: YOUR_BUNDLE_IDENTIFIER
scripts:
  - name: Get Flutter packages
    script: |
      flutter pub get
  - name: Install CocoaPods dependencies
    script: |
      find . -name "Podfile" -execdir pod install \;
  - name: Generate iOS project
    script: |
      flutter create --platforms=ios .
  - name: Update iOS deployment target
    script: |
      cd ios
      sed -i '' 's/platform :ios, .*/platform :ios, "13.0"/' Podfile
      sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' Runner.xcodeproj/project.pbxproj
  - name: Set up iOS code signing
    script: |
      xcode-project use-profiles
  - name: Build signed IPA
    script: |
      flutter build ipa --release \
        --export-options-plist=/Users/builder/export_options.plist
  - name: Verify IPA
    script: |
      echo "Checking for IPA..."
      find build/ios/ipa -name "*.ipa" -print
artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log
  - flutter_drive.log
  - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
